name: Daily Auto Crawl

on:
  schedule:
    - cron: "7 19 * * *"  # 매일 04:07 KST (= 전날 19:07 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # 수집 실패 시 이슈를 열고, 복구되면 닫는다

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04  # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀜 — Playwright 의존성이 검증된 버전에 고정
    timeout-minutes: 60
    env:
      CRAWL_REPORT_PATH: crawl-report.md  # main.py가 회사별 상태·실패 원인을 쓴다 (.gitignore, 커밋 안 됨)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 아래 git pull --rebase 에 전체 히스토리가 필요

      - name: Check if schedule is enabled
        id: check
        run: |
          ENABLED=$(python -c "import json; print(json.load(open('config.json'))['schedule']['enabled'])")
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          echo "Schedule enabled: $ENABLED"

      - uses: actions/setup-python@v7
        if: steps.check.outputs.enabled == 'True'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'True'
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: steps.check.outputs.enabled == 'True'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.check.outputs.enabled == 'True'
        run: playwright install chromium --with-deps

      - name: Run crawler
        id: crawl
        if: steps.check.outputs.enabled == 'True'
        run: python main.py

      # 일부 크롤러가 실패해도(main.py 종료코드 1) 수집된 데이터는 반영한다.
      # 실패 원인은 이 실행 화면(상단 오류 표시·요약 표)과 아래 이슈에 남는다.
      - name: Commit and push results
        if: always() && steps.check.outputs.enabled == 'True'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/jobs.json config.json
          git diff --staged --quiet || git commit -m "🔄 Daily crawl $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          # 크롤 도중 사람이 푸시했을 수 있다. rebase 없이는 그대로 거부되고
          # 그날 수집분이 통째로 유실된다.
          git pull --rebase origin main
          git push

      # 실패 이력은 대시보드가 아니라 이슈로: 실패하면 열고(이어지면 댓글로 쌓고), 복구되면 닫는다.
      # 이슈가 열리면 GitHub 알림(메일)이 간다.
      - name: Track failures in an issue
        if: always() && steps.check.outputs.enabled == 'True'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          LABEL="crawl-failure"
          gh label create "$LABEL" --color B60205 --description "자동 수집 실패" 2>/dev/null || true
          ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          BODY="$RUNNER_TEMP/issue-body.md"
          {
            echo "실행 기록: $RUN_URL"
            echo
            if [ -f "$CRAWL_REPORT_PATH" ]; then cat "$CRAWL_REPORT_PATH"
            else echo "크롤 스크립트가 보고서를 남기기 전에 종료됨 — 실행 기록의 로그를 확인하세요."; fi
          } > "$BODY"
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body-file "$BODY"
            else
              gh issue create --title "채용공고 자동 수집 실패" --label "$LABEL" --body-file "$BODY"
            fi
          elif [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "모든 회사 정상 수집으로 복구됨 — $RUN_URL"
          fi
