name: Daily Auto Crawl

on:
  schedule:
    - cron: "7 19 * * *"  # 매일 04:07 KST (= 전날 19:07 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 아래 git pull --rebase 에 전체 히스토리가 필요

      - name: Check if schedule is enabled
        id: check
        run: |
          ENABLED=$(python -c "import json; print(json.load(open('config.json'))['schedule']['enabled'])")
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          echo "Schedule enabled: $ENABLED"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'True'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'True'
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: steps.check.outputs.enabled == 'True'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.check.outputs.enabled == 'True'
        run: playwright install chromium --with-deps

      - name: Run crawler
        if: steps.check.outputs.enabled == 'True'
        run: python main.py

      # 일부 크롤러가 실패해도(main.py 종료코드 1) 수집된 데이터는 반영한다.
      # 실패 사실은 'Run crawler' 스텝이 빨간불로 남아 알림으로 전달된다.
      - name: Commit and push results
        if: always() && steps.check.outputs.enabled == 'True'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/jobs.json config.json
          git diff --staged --quiet || git commit -m "🔄 Daily crawl $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          # 크롤 도중 사람이 푸시했을 수 있다. rebase 없이는 그대로 거부되고
          # 그날 수집분이 통째로 유실된다.
          git pull --rebase origin main
          git push
