name: Daily Auto Crawl

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check if schedule is enabled
        id: check
        run: |
          ENABLED=$(python -c "import json; print(json.load(open('config.json'))['schedule']['enabled'])")
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          echo "Schedule enabled: $ENABLED"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'True'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'True'
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: steps.check.outputs.enabled == 'True'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.check.outputs.enabled == 'True'
        run: playwright install chromium --with-deps

      - name: Run crawler
        if: steps.check.outputs.enabled == 'True'
        run: python main.py

      - name: Commit and push results
        if: steps.check.outputs.enabled == 'True'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/jobs.json config.json
          git diff --staged --quiet || git commit -m "🔄 Daily crawl $(date +'%Y-%m-%d')"
          git push
