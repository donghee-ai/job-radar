name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "config.json"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt pytest
      # 분류기 정확도(평가셋 기준선)도 여기서 같이 검사된다
      - run: python -m pytest -q tests
