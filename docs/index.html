<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <div class="logo">JT</div>
                <div>
                    <h1>Job Tracker</h1>
                    <p class="subtitle" id="updated">데이터 로딩 중...</p>
                </div>
            </div>
            <div class="header-stats" id="header-stats"></div>
        </div>
    </header>

    <!-- 사이드바 + 메인 -->
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>카테고리</h3>
                <div id="category-list" class="filter-list"></div>
            </div>
            <div class="sidebar-section">
                <h3>회사</h3>
                <div id="company-list" class="filter-list"></div>
            </div>
        </aside>

        <main class="main">
            <div class="toolbar">
                <div class="search-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search" placeholder="직무 또는 키워드 검색...">
                </div>
                <div class="result-count" id="count">0개</div>
            </div>

            <div id="jobs" class="job-grid"></div>

            <div id="empty" class="empty hidden">
                <div class="empty-icon">📭</div>
                <h2>조건에 맞는 채용공고가 없습니다</h2>
                <p>필터를 조정하거나 크롤링을 다시 실행해보세요</p>
            </div>
        </main>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
