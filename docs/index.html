<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Job Radar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <div class="logo">JR</div>
                <div>
                    <h1>Job Radar</h1>
                    <p class="subtitle" id="updated">데이터 로딩 중...</p>
                </div>
            </div>
            <div class="header-stats" id="header-stats"></div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="active-filters" id="active-filters"></div>
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="roles">직무</button>
                <button class="sidebar-tab" data-tab="companies">회사</button>
            </div>
            <div class="tab-panel active" id="panel-roles">
                <div id="role-list" class="filter-list"></div>
            </div>
            <div class="tab-panel" id="panel-companies">
                <div id="company-list" class="filter-list"></div>
            </div>
        </aside>

        <main class="main">
            <div class="toolbar">
                <div class="search-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search" placeholder="직무 또는 키워드 검색...">
                </div>
                <div class="toolbar-right">
                    <select id="sort" class="sort-select">
                        <option value="latest">최신순</option>
                        <option value="location">위치순</option>
                    </select>
                    <div class="result-count" id="count">0개</div>
                </div>
            </div>

            <div id="jobs" class="job-grid"></div>

            <div id="empty" class="empty hidden">
                <div class="empty-icon">📭</div>
                <h2>조건에 맞는 채용공고가 없습니다</h2>
                <p>필터를 조정하거나 크롤링을 다시 실행해보세요</p>
            </div>
        </main>
    </div>
</div>

<div id="job-tooltip" class="job-tooltip"></div>

<script src="app.js"></script>
</body>
</html>
